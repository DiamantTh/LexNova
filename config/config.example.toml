# Vollständige Instanzvorlage. Der Browser-Installer schreibt nur die für die
# konkrete Installation notwendigen Werte; nicht gesetzte Security-Werte werden
# aus config/security.toml geerbt. Alle [security.*]-Abschnitte unten sind
# dokumentierte, installationsbezogene Überschreibungen dieser Standardwerte.

[app]
# Mandatory for passkeys: the public HTTPS URL, without a path.
# Use http://localhost:8080 only for local development.
base_url = "https://legal.example.com"
locale   = "de"

# Generated during installation — do NOT change after TOTP secrets are enrolled.
# Changing this key invalidates all existing TOTP registrations.
[security]
totp_app_key = ""

# Password hashing. Existing hashes are upgraded after a successful login when
# these parameters change.
[security.password]
algo = "argon2id"

[security.password.options]
memory_cost = 131072
time_cost   = 4
threads     = 2

# Login password policy.
[security.password_policy]
min_length = 16
max_length = 256
ascii_only = true
min_score  = 2

# Optional HaveIBeenPwned k-anonymity check. Disabled means no external call.
[security.password_policy.hibp]
enabled    = false
min_count  = 1
timeout_ms = 1500
fail_open  = true
endpoint   = "https://api.pwnedpasswords.com/range/"

# Subject generated by the public mailto helper.
[security.email_subject]
format         = "domain_datetime_tz" # domain_datetime_tz | domain_date | domain_only | custom
date_format    = "Y-n-j/H:i"
strip_www      = true
custom_pattern = ""

[security.generator.diceware]
word_count = 6
separator  = "-"

[security.generator.random]
length          = 20
require_upper   = true
require_digits  = true
require_symbols = true

# TOTP defaults. SHA-256 with 8 digits is not supported by every authenticator.
[security.totp]
digits    = 8
algorithm = "sha256"
period    = 30
window    = 1

# Applies to password, TOTP, Passkey and installer unlock attempts.
[security.rate_limit]
max_attempts  = 5
block_seconds = 300

# Optional Fail2ban-compatible signal log. The relative path is resolved from
# the LexNova project root and therefore works without access to system /var.
# After installation, the database setting has priority over this fallback.
[security.fail2ban]
enabled = false
path = "var/log/fail2ban.log"
settings_cache_ttl = 60

[db]
# MySQL/MariaDB example. Use driver = "pgsql" and usually port = 5432 for
# PostgreSQL. For SQLite only driver = "sqlite" and path = "/.../lexnova.sqlite"
# are required; the browser installer writes the matching form automatically.
driver   = "mysql" # mysql | pgsql | sqlite
host     = "localhost"
port     = 3306
name     = "lexnova"
user     = "lexnova"
password = "change-me"
charset  = "utf8mb4" # MySQL/MariaDB only

[install]
# Absolute paths as visible to PHP. On chroot/shared hosting these are paths
# inside the hosting account, not host-system /var or /etc paths.
lock          = "/path/to/lexnova/data/install.lock"
password_file = "/path/to/lexnova/data/install.pw"
config_file   = "/path/to/lexnova/config/config.toml"

[session]
name     = "lexnova_session"
secure   = true
httponly = true
samesite = "Strict"
cookie_lifetime = 0
cookie_path = "/"
cookie_domain = "" # empty = current host; do not broaden unless explicitly required

# Application cache for documents, settings and HIBP results. Each area uses
# its own namespace. "filesystem" needs no external service. "apcu" is a fast
# local web cache and requires APCu 5.1.10+ plus the optional Laminas APCu
# adapter. Valkey is Redis-protocol compatible; with adapter = "valkey" the
# PhpRedis extension 6+, the optional Laminas Redis adapter and a reachable
# server are required only when this adapter is selected.
# On adapter or connection failure LexNova falls back to filesystem caching.
[cache]
adapter     = "filesystem" # "filesystem" | "apcu" | "valkey"
# The installer generates this non-secret ID once. Give every manual instance
# a different value so shared APCu/Valkey pools cannot mix their cache keys.
namespace   = "lexnova.change-this-instance-id"
default_ttl = 3600
host        = "127.0.0.1" # Valkey only
port        = 6379        # Valkey only
database    = 0           # Valkey only
username    = ""          # Valkey ACL user; usually empty
password    = ""          # Valkey password; usually empty
tls         = false       # true for a TLS-protected Valkey connection

[log]
# Project-local absolute path as visible to PHP.
path  = "/path/to/lexnova/var/log/lexnova.log"
level = "warning"

[twig]
# Set to false to disable template caching (e.g. during development).
# A warning will be shown in the admin panel when cache is disabled.
cache = true
