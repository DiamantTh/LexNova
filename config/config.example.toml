[app]
# Mandatory for passkeys: the public HTTPS URL, without a path.
# Use http://localhost:8080 only for local development.
base_url = "https://legal.example.com"
locale   = "de"

# Generated during installation — do NOT change after TOTP secrets are enrolled.
# Changing this key invalidates all existing TOTP registrations.
[security]
totp_app_key = ""

# Optional Fail2ban-compatible signal log. The relative path is resolved from
# the LexNova project root and therefore works without access to system /var.
# After installation, the database setting has priority over this fallback.
[security.fail2ban]
enabled = false
path = "var/log/fail2ban.log"
settings_cache_ttl = 60

[db]
# Supported drivers: sqlite, mysql, pgsql
# SQLite  : dsn = "sqlite:/absolute/path/to/lexnova.sqlite"
# MySQL   : dsn = "mysql:host=localhost;dbname=lexnova;charset=utf8mb4"
# PostgreSQL: dsn = "pgsql:host=localhost;dbname=lexnova"
dsn      = "sqlite:/path/to/lexnova/data/lexnova.sqlite"
user     = ""
password = ""

[install]
lock          = "/path/to/lexnova/data/install.lock"
password_file = "/path/to/lexnova/data/install.pw"
config_file   = "/path/to/lexnova/config/config.toml"

[session]
name     = "lexnova_session"
secure   = true
httponly = true
samesite = "Strict"
cookie_lifetime = 0
cookie_path = "/"

# Public document cache. "filesystem" needs no external service. Valkey is
# Redis-protocol compatible; with adapter = "valkey" the PHP redis extension
# (or a compatible Redis client) and a reachable server are required.
# On connection failure LexNova falls back to filesystem caching.
[cache]
adapter     = "filesystem" # "filesystem" | "valkey"
dsn         = "redis://127.0.0.1:6379/0"
namespace   = "lexnova"
default_ttl = 3600

[log]
path  = "/path/to/lexnova/var/log/lexnova.log"
level = "info"

[twig]
# Set to false to disable template caching (e.g. during development).
# A warning will be shown in the admin panel when cache is disabled.
cache = true

# ── Brute-force rate limiting ─────────────────────────────────────────────────
# Applies to password, TOTP and Passkey login attempts.
# max_attempts  : failed login/TOTP attempts before the IP is temporarily blocked
# block_seconds : block duration in seconds (default: 5 minutes)
[security.rate_limit]
max_attempts  = 5
block_seconds = 300
